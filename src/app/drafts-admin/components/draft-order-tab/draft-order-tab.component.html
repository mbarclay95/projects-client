<div class="w-100 d-flex justify-content-between align-items-center mb-3">
  <div class="fw-bold">Pick Order</div>
  <div class="d-flex">
    <button nz-button [disabled]="!canEditOrder()" (click)="shuffle()" class="me-2">
      <fa-icon [icon]="shuffleIcon" class="me-1"></fa-icon>
      Shuffle
    </button>
    <button
      nz-button
      nzType="primary"
      [disabled]="!canEditOrder() || !isDirty()"
      [nzLoading]="draftsStore.loadingMember()"
      (click)="save()"
    >
      Save
    </button>
  </div>
</div>

@if (!canEditOrder()) {
  <div class="order-locked-note mb-2">The order is fixed once the draft is under way.</div>
}

@if (orderedMembers.length === 0) {
  <nz-empty nzNotFoundContent="No Members Yet"></nz-empty>
} @else {
  <div cdkDropList (cdkDropListDropped)="drop($event)" class="order-list">
    @for (member of orderedMembers; track member.id; let i = $index) {
      <div class="order-row" cdkDrag [cdkDragDisabled]="!canEditOrder()">
        <div class="order-number">{{ i + 1 }}</div>
        <button class="grip-handle" cdkDragHandle [disabled]="!canEditOrder()">
          <fa-icon [icon]="grip"></fa-icon>
        </button>
        <div class="order-name">{{ member.name }}</div>
      </div>
    }
  </div>
}
