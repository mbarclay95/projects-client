<nz-modal
  [nzVisible]="isVisible()"
  nzTitle="Add Items"
  [nzWidth]="modalWidth"
  [nzStyle]="modalStyle"
  [nzMaskClosable]="false"
  (nzOnCancel)="groceryListItemsStore.closePicker()"
>
  <ng-container *nzModalContent>
    <div class="filter-container">
      <nz-input-group class="filter-boxes" [nzSuffix]="clearSearchButton">
        <input nz-input placeholder="Search" [ngModel]="searchText()" (ngModelChange)="updateSearch($event)" />
      </nz-input-group>

      <ng-template #clearSearchButton>
        @if (searchText()) {
          <fa-icon [icon]="clear" class="clear-search" (click)="clearSearch()"></fa-icon>
        }
      </ng-template>
    </div>

    <div class="picker-list">
      @if (newItemName(); as name) {
        <div class="picker-row">
          <div class="picker-info">
            <div class="title">{{ name }}</div>
            <div class="unavailable-label">Not on the master list</div>
          </div>

          <button
            nz-button
            nzType="primary"
            nzSize="small"
            [nzLoading]="creatingItem()"
            [disabled]="creatingItem()"
            (click)="createAndAdd(name)"
          >
            Add to master list
          </button>
        </div>
      }

      @for (item of filteredItems(); track item.id) {
        <div class="picker-row">
          <div class="picker-info">
            <div class="title">{{ item.name }}</div>
            @if (unavailableHere().has(item.id)) {
              <div class="unavailable-label">Not at this store</div>
            }
          </div>

          @if (item.unit !== groceryItemUnit.none) {
            <nz-input-number
              class="amount"
              [ngModel]="quantityFor(item)"
              (ngModelChange)="setQuantity(item, $event)"
              [nzMin]="minFor(item)"
              [nzStep]="stepFor(item)"
            ></nz-input-number>
          }

          <button nz-button class="ant-btn-icon-only" nzType="text" (click)="toggle(item)">
            @if (groceryListItemsStore.entryByGroceryItemId().has(item.id)) {
              <fa-icon [icon]="added" class="text-success"></fa-icon>
            } @else {
              <fa-icon [icon]="plus" class="text-primary"></fa-icon>
            }
          </button>
        </div>
      }
    </div>
  </ng-container>

  <div *nzModalFooter>
    <button nz-button nzType="primary" (click)="groceryListItemsStore.closePicker()">Done</button>
  </div>
</nz-modal>
