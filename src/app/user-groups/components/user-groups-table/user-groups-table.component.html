<nz-table #groupsTableTag [nzData]="_groups">
  <thead>
    <tr>
      <th nzWidth="100px"></th>
      <th>Name</th>
      <th>Scope</th>
      <th>Number of Members</th>
      <th>Task Strategy</th>
    </tr>
  </thead>
  <tbody>
    @for (group of groupsTable?.data; track group.id) {
      <tr>
        <td>
          <button nz-button class="ant-btn-icon-only" nzType="text" (click)="openUserGroupModal.emit(group.id)">
            <fa-icon [icon]="edit" size="1x" class="text-primary"></fa-icon>
          </button>

          <button
            nz-button
            class="ant-btn-icon-only"
            nzType="text"
            nz-popconfirm
            nzPopconfirmTitle="Are you sure?"
            (nzOnConfirm)="deleteUserGroup.emit(group.id)"
          >
            <fa-icon [icon]="trash" size="1x" class="text-danger"></fa-icon>
          </button>
        </td>
        <td>{{ group.name }}</td>
        <td>{{ group.scope }}</td>
        <td>{{ group.members.length }}</td>
        <td>
          @if (group.scope === "tasks") {
            {{ group.taskStrategy }}
          }
        </td>
      </tr>
    }
  </tbody>
</nz-table>
