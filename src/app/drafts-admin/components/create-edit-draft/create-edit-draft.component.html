<nz-modal
  [nzVisible]="isVisible()"
  [nzTitle]="(model?.id === 0 ? 'Create' : 'Edit') + ' Draft'"
  [nzWidth]="modalWidth"
  (nzOnCancel)="draftsStore.clearCreateEditEntity()"
  nzOkText="Save"
  nzCancelText="Close"
  (nzOnOk)="saveDraft()"
  [nzStyle]="modalStyle"
  [nzCancelDisabled]="draftsStore.loadingOne()"
  [nzOkDisabled]="draftsStore.loadingOne()"
  [nzOkLoading]="draftsStore.loadingOne()"
  [nzMaskClosable]="false"
>
  <ng-container *nzModalContent>
    @if (model) {
      <div>
        <div class="w-100 mb-4">
          <div class="mb-2"><span class="text-danger">*</span> Draft Name:</div>

          <input nz-input [(ngModel)]="model.name" class="w-100" />
        </div>

        <div class="w-100 mb-4">
          <div class="mb-2">Draft Date:</div>

          <nz-date-picker
            [(ngModel)]="model.draftDate"
            nzFormat="MM/dd/yyyy HH:mm"
            [nzShowNow]="false"
            [nzShowTime]="{ nzFormat: 'HH:mm', nzUse12Hours: true, nzMinuteStep: 15 }"
          ></nz-date-picker>
        </div>

        <div class="w-100 mb-4">
          <div class="mb-2">Notes:</div>

          <textarea nz-input [(ngModel)]="model.notes"></textarea>
        </div>

        <div class="w-100 mb-4 d-flex align-items-end">
          <div class="me-4">Limit Participants:</div>

          <nz-switch [ngModel]="model.maxParticipants !== undefined" (ngModelChange)="updateMaxParticipantsSwitch($event)"></nz-switch>
        </div>

        @if (model.maxParticipants !== undefined) {
          <div class="w-100 mb-4">
            <div class="mb-2">Max Participants:</div>
            <nz-input-number [(ngModel)]="model.maxParticipants" [nzMin]="0"></nz-input-number>
          </div>
        }

        <div class="w-100">
          <div class="w-100 d-flex align-items-center mb-2">
            <div>Draft Image:</div>

            @if (model.draftImage) {
              <img [srcset]="model.draftImage.imagePath" [alt]="model.name" class="ms-3" height="40" />

              <button nz-button nzType="text" nzDanger nzSize="small" class="ms-2" (click)="removeImage()">Remove</button>
            }
          </div>

          <nz-upload
            class="w-100"
            nzType="drag"
            [nzMultiple]="false"
            [nzAction]="uploadPath()"
            (nzChange)="handleChange($event)"
            [(nzFileList)]="fileList"
          >
            <p class="ant-upload-text">Click or drag an image here (png, svg, jpg, jpeg, or webp, under 2MB)</p>
          </nz-upload>
        </div>
      </div>
    }
  </ng-container>
</nz-modal>
