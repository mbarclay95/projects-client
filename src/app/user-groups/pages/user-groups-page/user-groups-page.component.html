@if (!isMobile) {
  <app-page-header
    title="User Groups"
    buttonText="Create User Group"
    (createButtonClicked)="familiesStore.createEntity()"
  ></app-page-header>
}

<div>
  @if (familiesStore.loadingAll()) {
    <div class="d-flex w-100 justify-content-center align-items-center" style="height: 25vh">
      <nz-spin></nz-spin>
    </div>
  } @else {
    <app-user-groups-table
      [groups]="familiesStore.entities()"
      (openUserGroupModal)="familiesStore.editEntity($event)"
    ></app-user-groups-table>
  }
</div>

<app-create-edit-user-group-modal
  [showMembers]="true"
  [openModal]="familiesStore.createEditEntity()"
  [users]="usersStore.entities()"
></app-create-edit-user-group-modal>
