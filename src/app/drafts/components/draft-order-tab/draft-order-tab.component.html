<div class="w-100 d-flex justify-content-between align-items-center mb-3">
  <div class="fw-bold">Pick Order</div>
  <div class="d-flex">
    <button nz-button (click)="shuffle()" class="me-2">
      <fa-icon [icon]="shuffleIcon" class="me-1"></fa-icon>
      Shuffle
    </button>
    <button nz-button nzType="primary" [disabled]="!isDirty()" [nzLoading]="draftsStore.loadingMember()" (click)="save()">Save</button>
  </div>
</div>

@if (orderedMembers.length === 0) {
  <nz-empty nzNotFoundContent="No Members Yet"></nz-empty>
} @else {
  <div cdkDropList (cdkDropListDropped)="drop($event)" class="order-list">
    @for (member of orderedMembers; track member.id) {
      <div class="order-row" cdkDrag>
        <button class="grip-handle" cdkDragHandle>
          <fa-icon [icon]="grip"></fa-icon>
        </button>
        <div class="order-name">{{ member.name }}</div>
      </div>
    }
  </div>
}
