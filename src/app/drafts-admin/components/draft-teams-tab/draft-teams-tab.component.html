<div class="w-100 d-flex justify-content-between align-items-center mb-3">
  <div class="fw-bold">Teams</div>
  <div class="d-flex">
    <button nz-button (click)="cloneModalOpen.set(true)" class="me-2">Clone From Draft</button>
    <button nz-button nzType="primary" (click)="addTeam()">Add Team</button>
  </div>
</div>

@if (draft().draftTeams.length === 0) {
  <nz-empty nzNotFoundContent="No Teams Yet"></nz-empty>
} @else {
  <div class="teams-grid" [class.mobile]="isMobile">
    @for (team of draft().draftTeams; track team.id) {
      <div class="team-card">
        @if (team.s3Path) {
          <img [srcset]="team.imagePath" [alt]="team.name" class="team-logo" width="100" height="100" />
        } @else {
          <div class="team-logo team-placeholder">
            <fa-icon [icon]="placeholder"></fa-icon>
          </div>
        }

        <div class="team-name">{{ team.name }}</div>

        <div class="team-actions">
          <fa-icon class="text-primary" [icon]="edit" (click)="editTeam(team.id)"></fa-icon>
          <fa-icon
            class="text-danger"
            [icon]="trash"
            nz-popconfirm
            nzPopconfirmTitle="Are you sure?"
            (nzOnConfirm)="deleteTeam(team)"
          ></fa-icon>
        </div>
      </div>
    }
  </div>
}

<app-create-edit-draft-team [openModal]="draftsStore.selectedTeam()"></app-create-edit-draft-team>

<app-clone-draft-teams-modal
  [openModal]="cloneModalOpen()"
  [draftId]="draft().id"
  (closed)="cloneModalOpen.set(false)"
></app-clone-draft-teams-modal>
