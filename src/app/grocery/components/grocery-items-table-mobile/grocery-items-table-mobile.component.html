@if (items().length === 0) {
  <nz-empty class="my-4" nzNotFoundContent="No Items"></nz-empty>
} @else {
  <app-mobile-list>
    @for (item of items(); track item.id) {
      <app-mobile-list-row [aside]="formatGroceryItemAmount(item)" [meta]="detailsFor(item)" (rowClick)="editItem.emit(item.id)">
        {{ item.name }}
      </app-mobile-list-row>
    }
  </app-mobile-list>
}
