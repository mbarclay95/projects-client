<div class="fw-bold mb-2">Pick Order</div>

@if (sortedMembers.length === 0) {
  <nz-empty nzNotFoundContent="No one has joined yet"></nz-empty>
} @else {
  @let me = draftCacheService.me$ | async;
  <div class="order-list">
    @for (member of sortedMembers; track member.id) {
      <div class="order-row" [class.on-the-clock]="member.id === draft.onTheClockMemberId">
        @if (member.pickPosition) {
          <span class="position-badge">{{ member.pickPosition }}</span>
        }
        <div class="order-name">{{ member.name }}</div>
        @if (member.id === me?.draftMemberId) {
          <span class="you-badge">You</span>
        }
      </div>
    }
  </div>
}
