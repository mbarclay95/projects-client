<div class="fw-bold mb-2">Board</div>

@if (draft().draftPicks.length === 0) {
  <nz-empty nzNotFoundContent="No picks yet"></nz-empty>
} @else {
  <div class="board-list">
    @for (pick of draft().draftPicks; track pick.id) {
      <div class="board-row">
        <span class="round-badge">R{{ round(pick) }}</span>
        <span class="board-member">{{ memberName(pick.draftMemberId) }}</span>
        <span class="board-took">took</span>
        <span class="board-team">{{ teamName(pick.draftTeamId) }}</span>
      </div>
    }
  </div>
}
